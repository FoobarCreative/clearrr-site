####################################################
### Jekyll Configuration. No need to touch this. ###
####################################################

# Set the Sass partials directory, as we're using @imports
sass:
  style: :compressed # You might prefer to minify using :compressed

# Exclude these files from your production _site
exclude:
  - LICENSE
  - README.md
  - CNAME
  - CLAUDE.md
  - _pages/changelog.md
  - _pages/guides.html
  
include:
  - ".well-known"

collections:
  pages:
    output: true
    permalink: /:path
  guides:
    output: true
    permalink: /guides/:slug

defaults:
  - scope:
      path: ""
      type: "guides"
    values:
      layout: "guide"

# Markdown rendering
markdown: kramdown

# Plugins
plugins:
  - jekyll-sitemap
  - jekyll-redirect-from
