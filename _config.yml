# Feature List                            Edit, add or remove features to be presented.
features                                  :
  - title                                 : Digicam
    description                           : Hard flash, fine grain and that early-2000s point-and-shoot colour cast. The going-out look.
    fontawesome_icon_name                 : camera-retro
  - title                                 : Film & Y2K
    description                           : Soft halation and warm shadows from a roll of 35mm, or pushed contrast and CCD colour straight off a camera your parents owned.
    fontawesome_icon_name                 : film
  - title                                 : Golden Hour & Night Out
    description                           : Low warm light with a soft falloff at any time of day, or a flash-lit foreground with the room falling into dark behind you.
    fontawesome_icon_name                 : sun
  - title                                 : Disposable
    description                           : Blown-out flash and that end-of-roll, date-stamp look.
    fontawesome_icon_name                 : bolt
  - title                                 : Still looks like you
    description                           : Clearrr improves the photo without swapping out the person in it. Better light, cleaner detail, your actual features.
    fontawesome_icon_name                 : user-check
  - title                                 : Enhance, Unblur & Retouch
    description                           : Recover detail in flat or underexposed photos, sharpen the shot you only got one of, and light skin cleanup when you want it.
    fontawesome_icon_name                 : wand-magic-sparkles

